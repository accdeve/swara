<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SWARA — Desktop Web Board Game & Edukasi Sentuhan Aman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles/variables.css" />
  <link rel="stylesheet" href="./src/styles/ui.css" />
  <link rel="stylesheet" href="./src/styles/board.css" />
  <link rel="stylesheet" href="./src/styles/cards.css" />
</head>
<body>
  <div class="app-container">
    
    <!-- Top Header Navigation -->
    <header class="app-header">
      <div class="brand-section">
        <img src="./assets/logo.jpg" alt="Logo SWARA" class="brand-logo-img" />
        <div>
          <h1 class="brand-title">SWARA</h1>
          <p class="brand-tagline">Surakarta Board Game & Safe Touch Education</p>
        </div>
      </div>

      <div class="header-controls">
        <div class="mode-select-box">
          <button class="btn-mode active" id="btnModeLocal">2P Lokal</button>
          <button class="btn-mode" id="btnModeBot">VS Komputer</button>
        </div>
        
        <button class="btn-icon" id="btnAudioToggle" title="Matikan/Hidupkan Suara">
          <span id="audioIcon">🔊</span>
        </button>

        <button class="btn-text-action" id="btnOpenTutorial">
          <span>📖</span> Panduan Bermain
        </button>

        <button class="btn-text-action" id="btnRestartGame">
          <span>🔄</span> Reset Game
        </button>
      </div>
    </header>

    <!-- Main Game Layout Grid -->
    <main class="main-game-layout">
      
      <!-- Board Arena Center View -->
      <section class="board-arena-card">
        <div id="boardContainer" class="board-container">
          <!-- SVG Generated by BoardView.js -->
        </div>
      </section>

      <!-- Sidebar: Scoreboard & Actions -->
      <aside class="game-sidebar">
        <div id="scoreboardContainer">
          <!-- Populated by Scoreboard.js -->
        </div>

        <div class="quick-actions-card">
          <button class="btn-sidebar-action" id="btnSidebarTutorial">
            <span>💡</span> Cara Memakan Pion (Loop)
          </button>
          <button class="btn-sidebar-action" id="btnSidebarCardsInfo">
            <span>🃏</span> Info 10 Kartu Edukasi
          </button>
        </div>
      </aside>

    </main>

  </div>

  <!-- Interactive 3D Card Modal Container -->
  <div id="cardModalContainer" class="hidden"></div>

  <!-- Tutorial Modal Container -->
  <div id="tutorialModalContainer" class="hidden"></div>

  <!-- Name Edit Modal Container -->
  <div id="nameModalContainer" class="hidden"></div>

  <!-- GameOver Modal Container -->
  <div id="gameOverModalContainer" class="hidden"></div>

  <!-- Main JavaScript App -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
